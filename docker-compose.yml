version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  hf_cache:
